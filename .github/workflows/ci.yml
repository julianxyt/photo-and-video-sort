name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first; no point finishing a run
# against a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: an unpinned linter turns CI red on its own release schedule,
      # with no change to this repository.
      - run: pip install ruff==0.15.8

      - run: ruff check swipesort tests

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: the library this tool is aimed
        # at lives on a Windows PC, and the path, move and file-locking
        # behaviour it has to get right is exactly what differs there.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t tests -v

      - name: Smoke-test the CLI end to end
        shell: bash
        # The unit tests drive the library through its Python API. This drives
        # the same pipeline through the actual command line a user types,
        # including the dry-run guard, so a broken argument or entry point
        # cannot pass unnoticed.
        run: |
          set -euo pipefail
          python -c "
          import sys; sys.path[:0] = ['.', 'tests']
          from pathlib import Path
          from fixtures import build_library
          build_library(Path('ci-library'), keepers=12, junk_count=12)
          "
          python -m swipesort -L ci-library ingest --quiet
          python -m swipesort -L ci-library stats
          python -m swipesort -L ci-library queue --mode clean --limit 3
          # apply without --confirm must be a dry run: nothing may move.
          before=$(find ci-library -type f -not -path '*/.swipesort/*' | wc -l)
          python -m swipesort -L ci-library apply
          after=$(find ci-library -type f -not -path '*/.swipesort/*' | wc -l)
          test "$before" = "$after" || { echo "dry run moved files"; exit 1; }
